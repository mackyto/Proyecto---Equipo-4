<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>Ejercicio 32 - Constelaciones LM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.min.js" integrity="sha384-VHvPCCyXqtD5DqJeNxl2dtTyhF78xXNXdkwX1CZeRusQfRKp+tA7hAShOK/B/fQ2" crossorigin="anonymous"></script>
    <link  rel="stylesheet" href="../stylo/filprom22-a.css">
    <script>
      // Ejemplo starter JavaScript para evitar envíos invalidos de formularios
      (function() {
        'use strict';
        window.addEventListener('load', function() {
          // Fetch all the forms we want to apply custom Bootstrap validation styles to
          var forms = document.getElementsByClassName('needs-validation');
          // Loop over them and prevent submission
          var validation = Array.prototype.filter.call(forms, function(form) {
            form.addEventListener('submit', function(event) {
              if (form.checkValidity() === false) {
                event.preventDefault();
                event.stopPropagation();
              }
              form.classList.add('was-validated');
            }, false);
          });
        }, false);
      })();
    </script>
</head>
<body id="inst">
<div class="container">
<h1>Formulario</h1>

  <form class="needs-validation" action="mailto:mackyto@hotmail.com" method="get" novalidate oninput="valor.value=parseInt(range.value)">

    <div class="form-row">
      <div class="col-md-6">
        <div class="form-row form-group">
          <label class="col-form-label col-sm-2 text-md-right" for="name">Nombre</label>
          <div class="col-sm-10"><input type="text" class="form-control" id="name" placeholder="Jane Doe" name="no" required></div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-row form-group">
          <label class="col-form-label col-sm-2 text-md-right" for="email">Email</label>
          <div class="col-sm-10"><input type="email" class="form-control" id="email" placeholder="Enter email" name="em" required></div>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="col-6">
        <div class="form-row form-group">
          <label class="col-form-label col-sm-2 text-md-right" for="passwd1">Password</label>
          <div class="col-sm-10"><input type="password" class="form-control" id="passwd1" placeholder="Password" name="pass1" required></div>
        </div>
      </div>

      <div class="col-6">
        <div class="form-row form-group">
          <label class="col-form-label col-sm-2 text-md-right" for="passwd2">Password</label>
          <div class="col-sm-10"><input type="password" class="form-control" id="passwd2" placeholder="Retype Password" name="pass2" required></div>
        </div>
      </div>
    </div>

    <div class="form-row">
      <div class="col-md-6">
        <div class="form-row form-group">
          <label class="col-form-label col-sm-2 text-md-right" for="telfo">Teléfono</label>
          <div class="col-sm-10"><input type="text" class="form-control mb-2 mr-sm-2" id="telfo" placeholder="Teléfono" name="tel" required></div>
        </div>
      </div>

      <div class="col-md-6">
      <div class="form-row form-group">
        <label class="col-form-label col-sm-2 text-md-right" for="edd">Edad</label>
        <div class="col-sm-10"><input class="w-75" type="range" id="edd" name="range" min="1" max="99" value="21"><output class="font-weight-bold ml-5 col-form-label-lg" for="edd" name="valor">21</output></div>
      </div>
      </div>
    </div>

    <div class="form-row">
      <div class="col-12 col-md-2 offset-md-4"><button class="btn btn-primary w-100 text-center" type="submit">ENVIAR</button></div>
      <div class="col-12 col-md-2 offset-md-1"><button class="btn btn-warning w-100 text-center" type="reset">RESET</button></div>
    </div>
      
  </form>
</div>
</body>
</html>
