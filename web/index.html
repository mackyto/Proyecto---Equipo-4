<head>

    <title>Mazcu.fit Gym</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #000;
            color: #fff;
            min-height: 100vh;
        }

        header {
            height: 8rem;
            border-bottom: 3px solid #ff1a1a;

            display: flex;
            align-items: center;

        }

        .logo img {
            height: 7rem;
            width: auto;
        }

        nav {
            background-color: #DC143C;
            border-bottom: 3px solid #DC143C;
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav li {
            padding: 1rem 1.5rem;
            transition: all 0.3s ease;
            border-right: 1px solid #333;
        }

        nav li:last-child {
            border-right: none;
        }

        nav li:hover {
            background-color: #DC143C;
            color: #FFD700;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        main {
            min-height: calc(100vh - 11rem);
            background-color: #000;
        }
    </style>
</head>
