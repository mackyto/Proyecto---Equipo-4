<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mazcu.fit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #000;
            color: whitesmoke;
            min-height: 100vh;
        }

        header {
            height: 6rem;
            border-bottom: 2px solid rgb(255, 51, 0);
            background: linear-gradient(120deg, rgb(59, 40, 24) 30%, rgb(31, 56, 75) 70%);
            display: flex;
            align-items: center;
            padding: 0 2rem;
        }

        .logo img {
            height: 4em;
            width: auto;
        }

        nav {
            background-color: rgb(37, 35, 35);
        }

        nav ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        nav li {
            padding: 1rem;
            transition: all 0.3s ease;
            border-right: 1px solid rgba(0, 0, 0, 0.3);
        }

        nav li:last-child {
            border-right: none;
        }

        nav li:hover {
            background-color: rgb(255, 51, 0);
            color: white;
        }

        nav a {
            color: whitesmoke;
            text-decoration: none;
            font-weight: 500;
        }

        main {
            min-height: calc(100vh - 12rem);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="mazcufit.svg" alt="Mazcu.fit Logo">
        </div>
    </header>

    <nav>
        <ul>
        </ul>
    </nav>

    <main>
    </main>
</body>
</html>
